function escapeHtml(s) {

function genClientMsgId() {

function avatarHtml(nameLetter, avatarUrl, extraClass, forceLetterOnly, isOwner, isPremium, borderColor, isBanned) {
  let classes = extraClass || '';
  if (isOwner) classes += ' owner-avatar';
  if (isPremium && borderColor && borderColor !== 'none') {
    classes += ' avatar-premium-border ' + borderColor;
  }
  if (isBanned) {
    return `<div class="avatar ${classes}" style="filter:grayscale(1);background:#6b7788;">
      <span style="font-size:20px;">🚫</span>
    </div>`;
  }
  if (avatarUrl && !forceLetterOnly) {
    const src = avatarUrl.startsWith('http') ? avatarUrl : `${API_BASE}${avatarUrl}`;
    return `<div class="avatar ${classes}"><img src="${src}"></div>`;
  }
  return `<div class="avatar ${classes}">${nameLetter}</div>`;
}

function formatLastSeen(lastSeenStr) {
  if (!lastSeenStr) return 'был(а) недавно';
  try {
    const d = new Date(lastSeenStr.replace(' UTC', 'Z').replace(' ', 'T'));
    if (isNaN(d.getTime())) return 'был(а) недавно';
    const now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    const hh = String(d.getHours()).padStart(2,'0');
    const mm = String(d.getMinutes()).padStart(2,'0');
    if (sameDay) return `был(а) в сети сегодня в ${hh}:${mm}`;
    const dd = String(d.getDate()).padStart(2,'0');
    const mo = String(d.getMonth()+1).padStart(2,'0');
    return `был(а) в сети ${dd}.${mo} в ${hh}:${mm}`;
  } catch(e) { return 'был(а) недавно'; }
}

function presenceLabel(username) {
  const p = presenceMap[username];
  if (p && p.online) return 'в сети';
  if (p && p.last_seen) return formatLastSeen(p.last_seen);
  return 'был(а) недавно';
}

function playSound(type) {
  if (!soundEnabled) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = type === 'click' ? 800 : 600;
    osc.type = 'sine';
    gain.gain.value = 0.1;
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.08);
  } catch(e) {}
}

function copyInviteLink() {
  const link = document.getElementById('inviteLink').textContent;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(link).then(() => {
      showToast('📋 Ссылка скопирована!');
    }).catch(() => {
      fallbackCopy(link);
    });
  } else {
    fallbackCopy(link);
  }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    showToast('📋 Ссылка скопирована!');
  } catch(e) {
    showToast('Не удалось скопировать');
  }
  document.body.removeChild(ta);
}

    url = `https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent('Присоединяйся к DICEGRAM!')}`;
  } else if (platform === 'whatsapp') {

  if (url) window.open(url, '_blank');

// ===== ФУНКЦИЯ ЗАГРУЗКИ БАЛАНСА С СЕРВЕРА (ВСЕГДА) =====
async function fetchWalletBalanceFromServer(forceRefresh = false) {
  if (!session.token) return 0;
  try {
    const res = await fetch(`${API_BASE}/api/wallet/balance`, {
      headers: { 'Authorization': `Bearer ${session.token}` }
    });
    const data = await res.json();
    if (data.ok && data.balance !== undefined) {
      walletBalance = data.balance;
      // Обновляем отображение везде
      updateWalletDisplay();
      return walletBalance;
    }
    return walletBalance;
  } catch(e) {
    console.warn('Ошибка получения баланса:', e);
    return walletBalance;
  }
}

// ===== ФУНКЦИЯ ОБНОВЛЕНИЯ ВСЕХ ЭЛЕМЕНТОВ С БАЛАНСОМ =====
function updateWalletDisplay() {
  document.getElementById('walletBalanceDisplay').textContent = walletBalance + ' ❤️';
  document.getElementById('walletBalanceAmount').textContent = walletBalance;
  // Обновляем транзакции, если страница открыта
  if (document.getElementById('walletPage').classList.contains('active')) {
    renderWallet();
  }
}

// ===== ЗАГРУЗКА ИСТОРИИ ТРАНЗАКЦИЙ =====
async function loadWalletTransactions() {
  if (!session.token) return;
  try {
    const res = await fetch(`${API_BASE}/api/wallet/transactions`, {
      headers: { 'Authorization': `Bearer ${session.token}` }
    });
    const data = await res.json();
    if (data.ok) {
      walletTransactions = data.transactions || [];
      return walletTransactions;
    }
    return [];
  } catch(e) {
    console.warn('Ошибка загрузки транзакций:', e);
    return [];
  }
}

// ===== ОТКРЫТИЕ КОШЕЛЬКА (ВСЕГДА СВЕЖИЕ ДАННЫЕ) =====
async function loadWallet() {
  await fetchWalletBalanceFromServer(true);
  await loadWalletTransactions();
  renderWallet();
}

function renderWallet() {
  document.getElementById('walletBalanceAmount').textContent = walletBalance;
  document.getElementById('walletBalanceDisplay').textContent = walletBalance + ' ❤️';
  const container = document.getElementById('walletTransactions');
  if (!walletTransactions || walletTransactions.length === 0) {
    container.innerHTML = '<div class="empty-state">Нет операций</div>';
    return;
  }
  container.innerHTML = walletTransactions.slice(0, 20).map(t => {
    const amount = t.amount || 0;
    const isPositive = amount > 0;
    const displayAmount = isPositive ? `+${amount}` : `${amount}`;
    const desc = t.description || t.type || 'Операция';
    const date = t.created_at ? new Date(t.created_at).toLocaleString() : 'Сегодня';
    return `
      <div class="transaction-item">
        <div class="info">
          <div class="name">${escapeHtml(desc)}</div>
          <div class="date">${date}</div>
        </div>
        <div class="amount ${isPositive ? 'positive' : 'negative'}">
          ${displayAmount} ❤️
        </div>
      </div>
    `;
  }).join('');
}

// ===== УБРАНА ФУНКЦИЯ "ПОДАРИТЬ DICE WALLET" (ПРЯМОЙ ПЕРЕВОД) =====
// Она полностью удалена. Тратить DC можно ТОЛЬКО через магазин подарков.

// ===== ПОКУПКА ПОДАРКА (С МГНОВЕННЫМ ОБНОВЛЕНИЕМ БАЛАНСА) =====
async function giftConfirmPurchase() {
  if (!giftShopSelected) return;
  if (!giftRecipient) return;
  
  const price = giftShopSelected.price;
  
  // Сначала проверяем актуальный баланс с сервера
  const currentBalance = await fetchWalletBalanceFromServer(true);
  
  if (price > currentBalance) {
    showToast('❌ Недостаточно средств на кошельке');
    return;
  }
  
  try {
    const res = await fetch(`${API_BASE}/api/gifts/buy`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${session.token}`
      },
      body: JSON.stringify({
        gift_id: giftShopSelected.id,
        phone: giftRecipient.phone || '',
        buy_for_self: giftRecipient.username === session.username
      })
    });
    const data = await res.json();
    if (!data.ok) {
      showToast(data.error || 'Ошибка покупки');
      return;
    }
    
    // МГНОВЕННОЕ ОБНОВЛЕНИЕ БАЛАНСА С СЕРВЕРА
    await fetchWalletBalanceFromServer(true);
    
    // Обновляем транзакции
    await loadWalletTransactions();
    
    renderWallet();
    renderProfileGifts();
    closeModal('giftShopModal');
    showToast(`🎁 Подарок ${giftShopSelected.emoji} отправлен ${giftRecipient.name}!`);
    
    if (ws && ws.readyState === WebSocket.OPEN && giftRecipient.username !== session.username) {
      ws.send(JSON.stringify({
        type: 'message',
        to: giftRecipient.username,
        text: `🎁 Вам подарок: ${giftShopSelected.emoji} ${giftShopSelected.name} от ${session.name}!`,
        is_system: true
      }));
    }
    playSound('click');
  } catch(e) {
    showToast('Ошибка соединения с сервером');
    // Пробуем обновить баланс на всякий случай
    await fetchWalletBalanceFromServer(true);
  }
}

// ===== ПРОДАЖА ПОДАРКА (С МГНОВЕННЫМ ОБНОВЛЕНИЕМ БАЛАНСА) =====
async function sellGift(giftId) {
  if (!confirm('Продать подарок?')) return;
  try {
    const res = await fetch(`${API_BASE}/api/gifts/sell`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${session.token}`
      },
      body: JSON.stringify({ gift_id: giftId })
    });
    const data = await res.json();
    if (data.ok) {
      // МГНОВЕННОЕ ОБНОВЛЕНИЕ БАЛАНСА
      await fetchWalletBalanceFromServer(true);
      await loadWalletTransactions();
      renderWallet();
      renderProfileGifts();
      showToast('✅ ' + data.message);
    } else {
      showToast(data.error || 'Ошибка');
    }
  } catch(e) {
    showToast('Нет связи с сервером');
    await fetchWalletBalanceFromServer(true);
  }
}

async function checkUsername(username) {
  const hint = document.getElementById('usernameHint');
  try {
    const res = await fetch(`${API_BASE}/api/check_username`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username })
    });
    const data = await res.json();
    if (data.available) {
      hint.textContent = 'Свободен ✓';
      hint.className = 'hint ok';
      document.getElementById('btnUserNext').disabled = false;

    } else {

function renderProfileGifts() {
  const grid = document.getElementById('profileGiftsGrid');
  const empty = document.getElementById('profileGiftsEmpty');
  
  fetch(`${API_BASE}/api/gifts/user`, {
    headers: { 'Authorization': `Bearer ${session.token}` }
  })
  .then(r => r.json())
  .then(data => {
    if (!data.ok || !data.gifts || data.gifts.length === 0) {
      grid.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';
    const gifts = data.gifts || [];
    // Фильтруем только непроданные подарки
    const activeGifts = gifts.filter(g => !g.sold);
    if (activeGifts.length === 0) {
      grid.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    grid.innerHTML = activeGifts.map((g, i) => {
      const isOwner = g.from_username === session.username;
      const canSell = g.from_username !== session.username && !g.sold;
      // Проверяем 7 дней
      const createdDate = new Date(g.created_at);
      const now = new Date();
      const daysDiff = (now - createdDate) / (1000 * 60 * 60 * 24);
      const showSellBtn = canSell && daysDiff < 7;
      
      return `
      <div class="gift-item" style="animation-delay:${i * 0.05}s" onclick="openGiftDetailModal(${g.id})">
        <span class="gift-emoji">${g.gift_emoji || '🎁'}</span>
        <div class="gift-name">${g.gift_name || 'Подарок'}</div>
        <div class="gift-price">${g.price || 0} ❤️</div>
        <div class="gift-from">от ${g.from_username || 'неизвестно'}</div>
        ${showSellBtn ? `<button class="gift-sell-btn" onclick="event.stopPropagation(); sellGift(${g.id})">Продать</button>` : ''}
        ${isOwner ? '<span class="gift-owner-badge">СВОЙ</span>' : ''}
      </div>
    `}).join('');
  })
  .catch(() => {
    grid.innerHTML = '<div class="empty-state">Ошибка загрузки</div>';
  });
}

            <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);">
              <span style="color:var(--text-dim);font-size:14px;">От</span>

            </div>
            <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);">

            </div>
            <div style="display:flex;justify-content:space-between;padding:6px 0;">
              <span style="color:var(--text-dim);font-size:14px;">Стоимость</span>
              <span style="font-weight:700;font-size:15px;color:var(--gold);">${gift.price} ❤️</span>

              💰 Продать подарок
            </button>
          ` : (gift.sold ? `
            <div style="text-align:center;padding:12px;background:rgba(255,84,112,0.08);border-radius:12px;color:var(--danger);font-weight:600;font-size:14px;margin-top:12px;">
              ⏳ Подарок уже продан
            </div>
          ` : `
            <div style="text-align:center;padding:12px;background:var(--accent-grad-soft);border-radius:12px;color:var(--text-dim);font-size:13px;margin-top:12px;">

function giftFindRecipient() {
  const phone = document.getElementById('giftRecipientPhone').value.trim();
  const hint = document.getElementById('giftRecipientHint');
  if (!phone || phone.replace(/\D/g,'').length < 8) {
    hint.textContent = 'Введите корректный номер телефона';
    return;
  }
  const myPhoneDigits = session.phone.replace(/\D/g,'');
  const contactDigits = phone.replace(/\D/g,'');
  if (myPhoneDigits === contactDigits) {
    hint.textContent = 'Нельзя подарить подарок самому себе';
    return;
  }
  fetch(`${API_BASE}/api/user/profile/by_phone?phone=${encodeURIComponent(phone)}`, {
    headers: { 'Authorization': `Bearer ${session.token}` }
  })
  .then(r => r.json())
  .then(data => {
    if (!data.ok || !data.user) {
      hint.textContent = 'Пользователь с таким номером не найден в DICEGRAM';
      return;
    }
    if (data.user.is_banned) {
      hint.textContent = 'Пользователь заблокирован';
      return;

    giftRecipient = data.user;
    document.getElementById('giftRecipientName').textContent = giftRecipient.name + ' (@' + giftRecipient.username + ')';
    document.getElementById('giftShopStep1').style.display = 'none';
    document.getElementById('giftShopStep2').style.display = 'block';

async function syncProfileFromServer() {
  try {
    const res = await fetch(`${API_BASE}/api/me`, {
      headers: { 'Authorization': `Bearer ${session.token}` }
    });
    const data = await res.json();
    if (!data.ok) {
      if (data.banned) {
        showBannedScreen(session.phone);
        return;
      }
      return;
    }
    if (data.is_banned) {
      showBannedScreen(data.phone);
      return;
    }
    session.name = data.name;
    session.surname = data.surname || '';
    session.username = data.username;
    session.phone = data.phone;
    session.avatar_url = data.avatar_url || null;
    session.bio = data.bio || '';
    session.timezone = data.timezone || 'kazakhstan';
    session.is_owner = !!data.is_owner;
    session.is_verified = !!data.is_verified;
    session.is_premium = data.is_premium || false;
    session.premium_days = data.premium_days || 0;
    session.premium_nickname_color = data.premium_nickname_color || 'default';
    session.premium_avatar_border = data.premium_avatar_border || 'none';
    session.is_nft = data.is_nft || false;
    session.nft_username = data.nft_username || null;
    session.is_banned = data.is_banned || false;
    localStorage.setItem('dicegram_session_cache', JSON.stringify(session));
    renderProfileTab();
    updatePremiumUI();
    
    // Обновляем баланс ещё раз, если изменился
    await fetchWalletBalanceFromServer(true);
  } catch (e) {}
}

  } else if (isPremium && session.premium_nickname_color && session.premium_nickname_color !== 'default') {

    document.getElementById('profileNameDisplay').innerHTML = 'Удалённый аккаунт';
  } else if (session.avatar_url) {
    avatarWrap.innerHTML = `<img src="${API_BASE}${session.avatar_url}">`;
  } else {
    avatarWrap.innerHTML = `<span>${session.name.charAt(0).toUpperCase()}</span>`;

  document.getElementById('profileOwnerLine').style.display = isOwner ? 'flex' : 'none';

    document.getElementById('premiumColorDisplay').textContent = session.premium_nickname_color || 'Выбрать цвет ›';

function switchTab(tabId) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.querySelector(`.nav-item[data-tab="${tabId}"]`).classList.add('active');
  updateNavBadges();
  playSound('click');
  if (tabId === 'tabProfile') renderProfileGifts();
  if (tabId === 'tabSettings') {
    fetchWalletBalanceFromServer(true).then(() => updateWalletDisplay());
  }
}

function renderChatList() {
  const container = document.getElementById('chatListContainer');
  const entries = Object.entries(chats).sort((a, b) => {
    return (b[1].lastTime || '').localeCompare(a[1].lastTime || '');
  });
  if (entries.length === 0) {
    container.innerHTML = '<div class="empty-state">У вас пока нет чатов.<br>Нажмите ＋, чтобы создать группу</div>';
    return;
  }
  container.innerHTML = entries.map(([username, c]) => {
    const isGroup = c.is_group || false;
    const isSystemBot = c.avatar_letter === 'B' || username === SUPPORT_USERNAME;
    const avatarClass = isGroup ? 'group' : (username === SUPPORT_USERNAME ? 'support' : (c.avatar_letter === 'B' ? 'system-bot' : ''));
    const letter = c.avatar_letter || c.name.charAt(0).toUpperCase();
    const groupBadge = isGroup ? ' <span class="group-badge">ГРУППА</span>' : '';
    const isOwner = c.phone === OWNER_PHONE || c.is_owner;
    const unread = getUnreadCount(username);
    const unreadHtml = unread > 0 ? `<span class="unread-badge">${unread > 9 ? '9+' : unread}</span>` : '';
    const isNFT = c.is_nft || false;
    const nftBadge = isNFT ? ' <span class="nft-badge">🏆 NFT</span>' : '';
    const isPremium = c.is_premium || false;
    const premiumBadge = isPremium ? ' <span class="premium-badge">⭐</span>' : '';
    const isBanned = c.is_banned || false;
    
    let nameHtml = escapeHtml(c.name);
    if (isBanned) {
      nameHtml = 'Удалённый аккаунт';
    } else if (isOwner) {
      nameHtml = `<span class="rainbow-text">${nameHtml}</span>`;
    } else if (isPremium && c.premium_nickname_color && c.premium_nickname_color !== 'default') {
      const colorClass = `nickname-${c.premium_nickname_color}`;
      nameHtml = `<span class="${colorClass}">${nameHtml}</span>`;
    }
    
    return `
    <div class="chat-list-item" onclick="openChat('${username}', '${escapeHtml(c.name).replace(/'/g,"\\'")}', ${isGroup})">
      ${avatarHtml(letter, c.avatar_url, avatarClass, isSystemBot, isOwner, isPremium, c.premium_avatar_border, isBanned)}
      <div class="chat-item-body">
        <div class="chat-item-name">${nameHtml}${groupBadge}${nftBadge}${premiumBadge} ${c.is_verified ? '<span class="verified-badge">✓</span>' : ''} ${isBanned ? '<span class="banned-badge">ЗАБЛОКИРОВАН</span>' : ''} ${unreadHtml}</div>
        <div class="chat-item-last">${escapeHtml(c.lastText || '')}</div>
      </div>
      <div class="chat-item-time">${c.lastTime ? (c.lastTime.split(' ')[1]||'').substring(0,5) : ''}</div>
    </div>
  `;
  }).join('');
}

let contactSearchTimer = null;
function searchContacts() {
  clearTimeout(contactSearchTimer);
  const q = document.getElementById('contactSearch').value.trim();
  contactSearchTimer = setTimeout(() => {
    if (!q) { loadContactsList(); return; }
    doSearchContacts(q);
  }, 300);
}

async function doSearchContacts(q) {
  const container = document.getElementById('contactsResult');
  try {
    const res = await fetch(`${API_BASE}/api/contacts/search?q=${encodeURIComponent(q)}`, {
      headers: { 'Authorization': `Bearer ${session.token}` }
    });
    const data = await res.json();
    if (!data.ok || data.results.length === 0) {
      container.innerHTML = '<div class="empty-state">Никого не найдено</div>';
      return;
    }
    container.innerHTML = data.results.filter(u => u.username !== session.username).map(u => {
      const isOwner = u.phone === OWNER_PHONE || u.is_owner;
      const isPremium = u.is_premium || false;
      const isNFT = u.is_nft || false;
      const isBanned = u.is_banned || false;
      const displayName = isBanned ? 'Удалённый аккаунт' : u.name;
      return `
      <div class="chat-list-item" onclick="openChat('${u.username}', '${escapeHtml(displayName).replace(/'/g,"\\'")}')">
        ${avatarHtml(isBanned ? '🚫' : u.name.charAt(0).toUpperCase(), isBanned ? '' : u.avatar_url, '', false, isOwner, isPremium, u.premium_avatar_border, isBanned)}
        <div class="chat-item-body">
          <div class="chat-item-name">${escapeHtml(displayName)} ${u.is_verified ? '<span class="verified-badge">✓</span>' : ''} ${isPremium ? '<span class="premium-badge">⭐</span>' : ''} ${isNFT ? '<span class="nft-badge">🏆 NFT</span>' : ''} ${isBanned ? '<span class="banned-badge">ЗАБЛОКИРОВАН</span>' : ''}</div>
          <div class="chat-item-last">@${u.username}</div>
        </div>
      </div>
    `}).join('');
  } catch (e) {
    container.innerHTML = '<div class="empty-state">Нет связи с сервером</div>';
  }
}

async function loadContactsList() {
  const container = document.getElementById('contactsResult');
  try {
    const res = await fetch(`${API_BASE}/api/contacts/list`, {
      headers: { 'Authorization': `Bearer ${session.token}` }
    });
    const data = await res.json();
    if (!data.ok || !data.contacts.length) {
      container.innerHTML = '<div class="empty-state">У вас пока нет контактов.<br>Нажмите ＋, чтобы добавить.</div>';
      return;
    }
    container.innerHTML = data.contacts.filter(c => {
      if (c.live_user && c.live_user.username === session.username) return false;
      return true;
    }).map(c => {
      const live = c.live_user;
      const displayName = c.contact_name + (c.contact_surname ? ' ' + c.contact_surname : '');
      const uname = live ? live.username : (c.contact_username || '');
      const avatarUrl = live ? live.avatar_url : '';
      const verified = live && live.is_verified;
      const isOwner = live && (live.phone === OWNER_PHONE || live.is_owner);
      const isPremium = live && live.is_premium;
      const isNFT = live && live.is_nft;
      const isBanned = live && live.is_banned;
      const finalName = isBanned ? 'Удалённый аккаунт' : displayName;
      return `
      <div class="chat-list-item" onclick="${uname ? `openChat('${uname}', '${escapeHtml(finalName).replace(/'/g,"\\'")}')` : ''}">
        ${avatarHtml(isBanned ? '🚫' : displayName.charAt(0).toUpperCase(), isBanned ? '' : avatarUrl, '', false, isOwner, isPremium, live?.premium_avatar_border, isBanned)}
        <div class="chat-item-body">
          <div class="chat-item-name">${escapeHtml(finalName)} ${verified ? '<span class="verified-badge">✓</span>' : ''} ${isPremium ? '<span class="premium-badge">⭐</span>' : ''} ${isNFT ? '<span class="nft-badge">🏆 NFT</span>' : ''} ${isBanned ? '<span class="banned-badge">ЗАБЛОКИРОВАН</span>' : ''}</div>
          <div class="chat-item-last">${c.contact_phone}${uname ? ' · @'+uname : ' · не в DICEGRAM'}</div>
        </div>
      </div>`;
    }).join('');
  } catch(e) {
    container.innerHTML = '<div class="empty-state">Нет связи с сервером</div>';
  }
}

function openAddContactModal() {
  document.getElementById('contactName').value = '';
  document.getElementById('contactSurname').value = '';
  document.getElementById('contactPhone').value = '+777 ';
  document.getElementById('addContactHint').textContent = '';
  openModal('addContactModal');
}

async function submitAddContact() {
  const name = document.getElementById('contactName').value.trim();
  const surname = document.getElementById('contactSurname').value.trim();
  const phone = document.getElementById('contactPhone').value.trim();
  const hint = document.getElementById('addContactHint');
  if (!name) { hint.textContent = 'Имя обязательно'; return; }
  if (!phone || phone.replace(/\D/g,'').length < 8) { hint.textContent = 'Введите корректный номер телефона DICEGRAM'; return; }
  const myPhoneDigits = session.phone.replace(/\D/g,'');
  const contactDigits = phone.replace(/\D/g,'');
  if (myPhoneDigits === contactDigits) {
    hint.textContent = 'Нельзя добавить самого себя в контакты';
    return;
  }
  try {
    const res = await fetch(`${API_BASE}/api/contacts/add`, {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.token}` },
      body: JSON.stringify({ name, surname, phone })
    });
    const data = await res.json();
    if (!data.ok) { hint.textContent = data.error || 'Не удалось создать контакт'; return; }
    closeModal('addContactModal');
    showToast('Контакт создан');
    loadContactsList();
    playSound('click');
  } catch (e) {
    hint.textContent = 'Нет связи с сервером';
  }
}

function openCreateGroupModal() {
  document.getElementById('groupNameInput').value = '';
  document.getElementById('groupAvatarPreview').innerHTML = '📷';
  document.getElementById('createGroupHint').textContent = '';
  groupAvatarData = null;
  openModal('createGroupModal');
  playSound('click');
}

function onGroupAvatarPreviewSelected(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    groupAvatarData = e.target.result;
    document.getElementById('groupAvatarPreview').innerHTML = `<img src="${e.target.result}" style="width:100%;height:100%;object-fit:cover;border-radius:16px;">`;
  };
  reader.readAsDataURL(file);
}

async function submitCreateGroup() {
  const name = document.getElementById('groupNameInput').value.trim();
  const hint = document.getElementById('createGroupHint');
  if (!name) { hint.textContent = 'Введите название группы'; return; }
  
  try {
    let avatarUrl = '';
    if (groupAvatarData) {
      const formData = new FormData();
      const blob = await fetch(groupAvatarData).then(r => r.blob());
      formData.append('avatar', blob, 'group_avatar.jpg');
      formData.append('group_id', 'temp');
      const uploadRes = await fetch(`${API_BASE}/api/groups/upload_avatar`, {
        method: 'POST', headers: { 'Authorization': `Bearer ${session.token}` },
        body: formData
      });
      const uploadData = await uploadRes.json();
      if (uploadData.ok) avatarUrl = uploadData.avatar_url;
    }
    
    const res = await fetch(`${API_BASE}/api/groups/create`, {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.token}` },
      body: JSON.stringify({ name, avatar_url: avatarUrl })
    });
    const data = await res.json();
    if (!data.ok) { hint.textContent = data.error || 'Ошибка создания'; return; }
    closeModal('createGroupModal');
    showToast('Группа создана!');
    await loadGroupsList();
    await loadChatsList();
    playSound('click');
  } catch(e) {
    hint.textContent = 'Нет связи с сервером';
  }
}

async function openGroupProfile(groupId) {
  try {
    const res = await fetch(`${API_BASE}/api/groups/${groupId}/info`, {
      headers: { 'Authorization': `Bearer ${session.token}` }
    });
    const data = await res.json();
    if (!data.ok) { showToast(data.error || 'Ошибка загрузки группы'); return; }
    
    const group = data.group;
    const members = data.members;
    const isOwner = data.is_owner;
    
    document.getElementById('gpName').textContent = group.name;
    document.getElementById('gpId').textContent = 'ID: ' + group.group_id;
    document.getElementById('gpAvatarWrap').innerHTML = group.avatar_url
      ? `<img src="${API_BASE}${group.avatar_url}" style="width:100%;height:100%;object-fit:cover;">`
      : `<span>${group.name.charAt(0).toUpperCase()}</span>`;
    
    const owner = members.find(m => m.role === 'owner');
    document.getElementById('gpOwner').textContent = owner ? 'Владелец: @' + owner.username : 'Владелец: —';
    
    const list = document.getElementById('gpMembersList');
    let html = `<div class="section-label" style="margin-top:12px;">Участники (${members.length})</div>`;
    
    if (isOwner) {
      html += `<div class="add-member-input">
        <input class="field" id="gpAddMemberInput" placeholder="@username" style="margin:0;flex:1;">
        <button class="btn btn-primary" style="padding:12px 20px;width:auto;" onclick="submitAddMemberToGroup()">➕</button>
      </div>`;
    }
    
    members.forEach(m => {
      const roleLabel = m.role === 'owner' ? '👑 Владелец' : (m.role === 'admin' ? '⚡ Админ' : '👤 Участник');
      const roleClass = m.role === 'owner' ? 'owner' : (m.role === 'admin' ? 'admin' : '');
      const isSelf = m.username === session.username;
      const canMakeAdmin = isOwner && m.role !== 'owner' && m.username !== session.username;
      html += `
        <div class="group-member-item">
          <div class="avatar" style="width:36px;height:36px;border-radius:12px;font-size:14px;background:var(--accent-grad);">
            ${m.username.charAt(0).toUpperCase()}
          </div>
          <div class="group-member-name">@${m.username} ${isSelf ? '(вы)' : ''}</div>
          <div class="group-member-role ${roleClass}">${roleLabel}</div>
          ${canMakeAdmin ? `<span class="group-member-action" onclick="toggleAdmin('${groupId}','${m.username}')">${m.role === 'admin' ? 'Снять админа' : 'Назначить админа'}</span>` : ''}
        </div>
      `;
    });
    
    list.innerHTML = html;
    document.getElementById('groupProfileView').style.display = 'flex';
  } catch(e) {
    showToast('Нет связи с сервером');
  }
}

async function submitAddMemberToGroup() {
  const input = document.getElementById('gpAddMemberInput');
  const username = input.value.trim().replace('@', '');
  if (!username) return;
  
  try {
    const res = await fetch(`${API_BASE}/api/groups/${currentGroupId}/add_member`, {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.token}` },
      body: JSON.stringify({ username })
    });
    const data = await res.json();
    if (!data.ok) { showToast(data.error || 'Ошибка'); return; }
    showToast('Участник добавлен');
    input.value = '';
    await openGroupProfile(currentGroupId);
    playSound('click');
  } catch(e) { showToast('Нет связи с сервером'); }
}

async function toggleAdmin(groupId, username) {
  try {
    const res = await fetch(`${API_BASE}/api/groups/${groupId}/set_admin`, {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.token}` },

    if (!data.ok) { showToast(data.error || 'Ошибка'); return; }

    playSound('click');
  } catch(e) { showToast('Нет связи с сервером'); }
}

// ===================== CHAT & MESSAGING =====================
async function openChat(username, name, isGroup = false) {
  if (!username) return;
  if (!isGroup && username === session.username) {
    showToast('Нельзя открыть чат с самим собой');
    return;
  }
  
  resetUnread(username);
  currentChatWith = username;
  currentChatIsGroup = isGroup;
  currentGroupId = isGroup ? username : null;
  
  const displayName = name || username;
  const isOwner = chats[username]?.phone === OWNER_PHONE || chats[username]?.is_owner;
  const isPremium = chats[username]?.is_premium || false;
  const isNFT = chats[username]?.is_nft || false;
  const isBanned = chats[username]?.is_banned || false;
  
  let nameHtml = escapeHtml(displayName);
  if (isBanned) {
    nameHtml = 'Удалённый аккаунт';
  } else if (isOwner) {
    nameHtml = `<span class="rainbow-text">${nameHtml}</span>`;
  } else if (isPremium && chats[username]?.premium_nickname_color && chats[username]?.premium_nickname_color !== 'default') {
    const colorClass = `nickname-${chats[username]?.premium_nickname_color}`;
    nameHtml = `<span class="${colorClass}">${nameHtml}</span>`;
  }
  
  document.getElementById('chatHeaderName').innerHTML = nameHtml + (chats[username]?.is_verified ? ' <span class="verified-badge">✓</span>' : '') + (isGroup ? ' <span class="group-badge">ГРУППА</span>' : '') + (isPremium ? ' <span class="premium-badge">⭐</span>' : '') + (isNFT ? ' <span class="nft-badge">🏆 NFT</span>' : '') + (isBanned ? ' <span class="banned-badge">ЗАБЛОКИРОВАН</span>' : '');
  
  const isSystemBot = chats[username]?.avatar_letter === 'B' || username === SUPPORT_USERNAME;
  const avatarClasses = isGroup ? 'group' : (username === SUPPORT_USERNAME ? 'support' : '');
  document.getElementById('chatHeaderAvatar').innerHTML = avatarHtml(
    isBanned ? '🚫' : (chats[username]?.avatar_letter || displayName.charAt(0).toUpperCase()),
    isBanned ? '' : chats[username]?.avatar_url,
    avatarClasses,
    isSystemBot || isBanned,
    isOwner,
    isPremium,
    chats[username]?.premium_avatar_border,
    isBanned
  );
  
  const statusEl = document.getElementById('chatHeaderStatus');
  statusEl.className = 'chat-header-status';
  if (isGroup) {
    statusEl.textContent = 'группа';
  } else if (username === SUPPORT_USERNAME) {
    statusEl.textContent = 'официальный бот поддержки';
  } else if (isBanned) {
    statusEl.textContent = 'аккаунт заблокирован';
    statusEl.className = 'chat-header-status banned-line';
  } else {
    statusEl.textContent = presenceLabel(username);
    if (presenceMap[username]?.online) statusEl.classList.add('online');
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'request_presence', username }));
    }
  }

  document.getElementById('chatInputBar').style.display = isBanned ? 'none' : 'flex';
  document.getElementById('chatView').classList.add('active');
  document.getElementById('messagesContainer').innerHTML = '';
  cancelImagePreview();

  chats[username] = chats[username] || { name: displayName, lastText: '', lastTime: '' };

  try {
    const endpoint = isGroup ? `/api/groups/${username}/messages` : `/api/history?with=${username}`;
    const res = await fetch(`${API_BASE}${endpoint}`, {
      headers: { 'Authorization': `Bearer ${session.token}` }
    });
    const data = await res.json();
    if (data.ok) {
      const msgs = data.messages || [];
      msgs.forEach(m => {
        const sender = m.sender || m.from;
        const dir = sender === session.username ? 'out' : 'in';
        appendBubble(dir, m.text || '', m.created_at, m.attachment_url, m.id || Date.now(), m.reply_to, m.is_system);
      });
    }
  } catch (e) {}

  scrollMessagesToBottom();
  loadChatsList();
  updateNavBadges();
  playSound('click');
}

function closeChat() {
  document.getElementById('chatView').classList.remove('active');
  currentChatWith = null;
  currentChatIsGroup = false;
  currentGroupId = null;
  cancelImagePreview();
  closeContextMenu();
}

let messageCounter = 0;

function appendBubble(dir, text, time, attachmentUrl, msgId, replyTo, isSystem) {
  const container = document.getElementById('messagesContainer');
  
  if (isSystem && text && text.includes('NFT')) {
    const div = document.createElement('div');
    div.className = 'bubble nft-system';
    const lines = text.split('\n');
    let nftName = '';
    let price = '';
    let from = '';
    lines.forEach(line => {
      if (line.includes('@') && !line.includes('🏆')) {
        const match = line.match(/@([a-zA-Z0-9_]{3,20})/);
        if (match) nftName = match[1];
      }
      if (line.includes('$')) {
        const match = line.match(/\$(\d+\.?\d*)/);
        if (match) price = match[1];
      }
      if (line.includes('Приобретено:')) {
        const match = line.match(/@([a-zA-Z0-9_]{3,20})/);
        if (match) from = match[1];
      }
    });
    div.innerHTML = `
      <span class="nft-icon">🏆</span>
      <div class="nft-name">@${nftName || 'NFT'}</div>
      <div>${linkifyMentions(text)}</div>
      ${price ? `<div class="nft-price">💰 $${price}</div>` : ''}
      ${from ? `<div class="nft-from">🎁 от @${from}</div>` : ''}
    `;
    container.appendChild(div);
    return;
  }
  
  if (dir === 'system' || isSystem) {
    const div = document.createElement('div');
    div.className = 'bubble system';
    div.innerHTML = linkifyMentions(text);
    container.appendChild(div);
    return;
  }
  
  const row = document.createElement('div');
  row.className = `bubble-row ${dir}`;
  row.dataset.msgId = msgId || (++messageCounter);
  row.dataset.sender = dir === 'out' ? session.username : currentChatWith;
  
  const wrap = document.createElement('div');
  wrap.className = 'bubble-wrap';
  
  if (replyTo) {
    const replyDiv = document.createElement('div');
    replyDiv.className = 'reply-preview';
    replyDiv.innerHTML = `<span class="rp-name">${escapeHtml(replyTo.sender)}:</span> <span class="rp-text">${escapeHtml(replyTo.text)}</span>`;
    wrap.appendChild(replyDiv);
  }
  
  const div = document.createElement('div');
  div.className = `bubble ${dir}`;
  
  let inner = '';
  if (attachmentUrl) {
    inner += `<img class="attachment" src="${attachmentUrl.startsWith('http') ? attachmentUrl : API_BASE + attachmentUrl}">`;
  }
  if (text) inner += linkifyMentions(text);
  
  const timeStr = (time || '').split(' ')[1]?.substring(0,5) || '';
  const checkMark = dir === 'out' ? `<span class="check-mark sent">✓✓</span>` : '';
  inner += `<div class="bubble-time">${timeStr} ${checkMark}</div>`;
  
  div.innerHTML = inner;
  wrap.appendChild(div);
  row.appendChild(wrap);
  
  let pressTimer = null;
  let isPressed = false;
  
  const startPress = (e) => {
    isPressed = true;
    pressTimer = setTimeout(() => {
      if (isPressed) {
        showContextMenu(e, row.dataset.msgId, row.dataset.sender, text);
      }
    }, 500);
  };
  
  const endPress = () => {
    isPressed = false;
    clearTimeout(pressTimer);
  };
  
  row.addEventListener('touchstart', startPress, { passive: true });
  row.addEventListener('touchend', endPress);
  row.addEventListener('touchmove', endPress);
  row.addEventListener('mousedown', startPress);
  row.addEventListener('mouseup', endPress);
  row.addEventListener('mouseleave', endPress);
  
  container.appendChild(row);
}

function scrollMessagesToBottom() {
  const c = document.getElementById('messagesContainer');
  c.scrollTop = c.scrollHeight;
}

function linkifyMentions(text) {
  const escaped = escapeHtml(text);
  return escaped.replace(/@([a-zA-Z0-9_]{3,20})/g, (match, uname) => {
    if (uname.toLowerCase() === session.username.toLowerCase()) {
      return `<span style="color:var(--accent);font-weight:700;">@${uname}</span>`;
    }
    return `<span class="mention-link" onclick="event.stopPropagation(); handleMentionClick('${uname}')">@${uname}</span>`;
  });
}

async function handleMentionClick(username) {
  if (username.toLowerCase() === session.username.toLowerCase()) {
    showToast('Это вы');
    return;
  }
  try {
    const res = await fetch(`${API_BASE}/api/user/profile?username=${encodeURIComponent(username)}`, {
      headers: { 'Authorization': `Bearer ${session.token}` }
    });
    const data = await res.json();
    if (data.ok) {
      openUserProfile(username);
    } else {
      showToast('Пользователь @' + username + ' не найден');
    }
  } catch(e) { showToast('Нет связи с сервером'); }
}

// ===================== CONTEXT MENU =====================
function showContextMenu(e, msgId, sender, text) {
  const menu = document.getElementById('contextMenu');
  const rect = e.touches ? { clientX: e.touches[0].clientX, clientY: e.touches[0].clientY } : e;
  
  selectedMsgId = msgId;
  selectedMsgText = text;
  selectedMsgSender = sender;
  selectedMsgElement = document.querySelector(`[data-msg-id="${msgId}"]`);
  
  const isOwn = sender === session.username;
  
  document.getElementById('editMsgBtn').style.display = isOwn ? 'flex' : 'none';
  document.getElementById('deleteMsgBtn').style.display = isOwn ? 'flex' : 'none';
  document.getElementById('deleteMsgBtn').textContent = isOwn ? '🗑️ Удалить у всех' : '🗑️ Удалить у себя';
  
  menu.style.left = Math.min(rect.clientX, window.innerWidth - 200) + 'px';
  menu.style.top = Math.min(rect.clientY, window.innerHeight - 200) + 'px';
  menu.classList.add('active');
  
  setTimeout(() => {
    document.addEventListener('click', closeContextMenuOutside);
  }, 10);
}

function closeContextMenuOutside(e) {
  const menu = document.getElementById('contextMenu');
  if (!menu.contains(e.target)) {
    closeContextMenu();
  }
}

function closeContextMenu() {
  const menu = document.getElementById('contextMenu');
  if (menu) menu.classList.remove('active');
  document.removeEventListener('click', closeContextMenuOutside);
}

function replyToMessage() {
  if (!selectedMsgId) return;
  currentReplyTo = {
    id: selectedMsgId,
    sender: selectedMsgSender,
    text: selectedMsgText
  };
  showToast(`Ответ на сообщение от ${selectedMsgSender}`);
  closeContextMenu();
  document.getElementById('messageInput').focus();
  playSound('click');
}

function editMessage() {
  if (!selectedMsgId || selectedMsgSender !== session.username) return;
  const newText = prompt('Редактировать сообщение:', selectedMsgText);
  if (newText !== null && newText.trim() !== '') {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({
        type: 'edit_message',
        message_id: selectedMsgId,
        text: newText.trim(),
        to: currentChatWith,
        is_group: currentChatIsGroup
      }));
    }
    if (selectedMsgElement) {
      const bubble = selectedMsgElement.querySelector('.bubble');
      if (bubble) {
        const timeEl = bubble.querySelector('.bubble-time');
        const timeHtml = timeEl ? timeEl.outerHTML : '';
        bubble.innerHTML = linkifyMentions(newText.trim()) + timeHtml;
      }
    }
    playSound('click');
  }
  closeContextMenu();
}

function deleteMessage() {
  if (!selectedMsgId) return;
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({
      type: 'delete_message',
      message_id: selectedMsgId,
      to: currentChatWith,
      is_group: currentChatIsGroup
    }));
  }
  if (selectedMsgElement) {
    selectedMsgElement.remove();
  }
  closeContextMenu();
  showToast('Сообщение удалено');
  playSound('click');
}

function addReaction(emoji) {
  if (!selectedMsgId) return;
  closeContextMenu();
  showToast(`Реакция ${emoji} добавлена`);
  playSound('click');
}

function onChatImageSelected(e) {
  const file = e.target.files[0];
  if (!file) return;
  pendingImageFile = file;
  const reader = new FileReader();
  reader.onload = ev => {
    document.getElementById('imagePreviewImg').src = ev.target.result;
    document.getElementById('imagePreviewBar').style.display = 'flex';
    playSound('click');
  };
  reader.readAsDataURL(file);
}

function cancelImagePreview() {
  pendingImageFile = null;
  document.getElementById('imagePreviewImg').src = '';
  document.getElementById('imagePreviewBar').style.display = 'none';
  document.getElementById('chatFileInput').value = '';
}

function onTypingInput() {
  if (!currentChatWith || currentChatIsGroup) return;
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'typing', to: currentChatWith }));
  }
}

async function sendMessage() {
  const input = document.getElementById('messageInput');
  const text = input.value.trim();
  if (!text && !pendingImageFile) return;

  const now = new Date();
  const timeStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:00`;

  let attachmentUrl = null;

  if (pendingImageFile) {
    try {
      const formData = new FormData();
      formData.append('file', pendingImageFile);
      formData.append('to', currentChatWith);
      const endpoint = currentChatIsGroup ? '/api/groups/upload' : '/api/upload';
      const res = await fetch(`${API_BASE}${endpoint}`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${session.token}` },
        body: formData
      });
      const data = await res.json();
      if (data.ok) {
        attachmentUrl = data.url || data.attachment_url;
        if (data.created_at) {
          appendBubble('out', text, data.created_at, attachmentUrl, data.msg_id || Date.now(), currentReplyTo);
          if (chats[currentChatWith]) {
            chats[currentChatWith].lastText = text || 'Фотография';
            chats[currentChatWith].lastTime = data.created_at;
            renderChatList();
          }
          input.value = '';
          currentReplyTo = null;
          cancelImagePreview();
          scrollMessagesToBottom();
          playSound('click');
          return;
        }
      } else {
        showToast(data.error || 'Ошибка загрузки фото');
        return;
      }
    } catch(e) {
      showToast('Ошибка загрузки фото');
      return;
    }
  }

  const clientId = genClientMsgId();
  const msgPayload = {
    type: currentChatIsGroup ? 'group_message' : 'message',
    to: currentChatWith,
    text: text,
    client_msg_id: clientId
  };

  if (currentChatIsGroup) {
    msgPayload.group_id = currentChatWith;
  }

  sentMessages.add(clientId);

  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(msgPayload));
  }

  appendBubble('out', text, timeStr, null, clientId, currentReplyTo);

  if (chats[currentChatWith]) {
    chats[currentChatWith].lastText = text || 'Фотография';
    chats[currentChatWith].lastTime = timeStr;
    renderChatList();
  }

  input.value = '';
  currentReplyTo = null;
  cancelImagePreview();
  scrollMessagesToBottom();
  playSound('click');
}

// ===================== USER PROFILE VIEW =====================
async function openUserProfile(username) {
  try {
    const res = await fetch(`${API_BASE}/api/user/profile?username=${encodeURIComponent(username)}`, {
      headers: { 'Authorization': `Bearer ${session.token}` }
    });
    const data = await res.json();
    if (!data.ok) { showToast(data.error || 'Пользователь не найден'); return; }

    const u = data.user;
    currentUpUser = username;
    const isOwner = u.phone === OWNER_PHONE || u.is_owner;
    const isPremium = u.is_premium || false;
    const isNFT = u.is_nft || false;
    const isBanned = u.is_banned || false;
    
    let contactName = isBanned ? 'Удалённый аккаунт' : u.name;
    let contactSurname = isBanned ? '' : (u.surname || '');
    try {
      const contactsRes = await fetch(`${API_BASE}/api/contacts/list`, {
        headers: { 'Authorization': `Bearer ${session.token}` }
      });
      const contactsData = await contactsRes.json();
      if (contactsData.ok) {
        const contact = contactsData.contacts.find(c => c.contact_username === username);
        if (contact && !isBanned) {
          contactName = contact.contact_name;
          contactSurname = contact.contact_surname || '';
        }
      }
    } catch(e) {}
    
    let nameHtml = escapeHtml(contactName + (contactSurname ? ' ' + contactSurname : ''));
    if (isBanned) {
      nameHtml = 'Удалённый аккаунт';
    } else if (isOwner) {
      nameHtml = `<span class="rainbow-text">${nameHtml}</span>`;
    } else if (isPremium && u.premium_nickname_color && u.premium_nickname_color !== 'default') {
      const colorClass = `nickname-${u.premium_nickname_color}`;
      nameHtml = `<span class="${colorClass}">${nameHtml}</span>`;
    }
    
    document.getElementById('upName').innerHTML = nameHtml + (u.is_verified && !isBanned ? ' <span class="verified-badge">✓</span>' : '');
    document.getElementById('upUsername').textContent = '@' + u.username;
    document.getElementById('upPhone').textContent = isBanned ? '' : (u.phone || '');
    
    document.getElementById('upPremiumBadge').style.display = isPremium && !isBanned ? 'block' : 'none';
    document.getElementById('upNftBadge').style.display = isNFT && !isBanned ? 'block' : 'none';
    
    const bioEl = document.getElementById('upBio');
    if (u.bio && !isBanned) { bioEl.textContent = u.bio; bioEl.style.display = 'block'; }
    else { bioEl.style.display = 'none'; }

    document.getElementById('upStatusLine').textContent = isBanned ? 'аккаунт заблокирован' : (u.online ? 'в сети' : formatLastSeen(u.last_seen));
    document.getElementById('upVerifiedLine').style.display = u.is_verified && !isBanned ? 'flex' : 'none';
    document.getElementById('upBannedLine').style.display = isBanned ? 'block' : 'none';

    const avatarWrap = document.getElementById('upAvatarWrap');
    avatarWrap.className = 'avatar profile-avatar';
    if (isPremium && u.premium_avatar_border && u.premium_avatar_border !== 'none') {
      avatarWrap.classList.add('avatar-premium-border', u.premium_avatar_border);
    }
    if (isOwner) avatarWrap.classList.add('owner-avatar-profile');
    
    if (isBanned) {
      avatarWrap.innerHTML = `<img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%236b7788' width='100' height='100'/%3E%3Ctext x='50' y='58' font-size='36' text-anchor='middle' fill='%23a8b3c4' font-family='Arial'%3E🚫%3C/text%3E%3C/svg%3E" style="filter:grayscale(1);">`;
    } else if (u.avatar_url) {
      avatarWrap.innerHTML = `<img src="${API_BASE}${u.avatar_url}" style="width:100%;height:100%;object-fit:cover;">`;
    } else {
      avatarWrap.innerHTML = `<span>${u.name.charAt(0).toUpperCase()}</span>`;
    }

    document.getElementById('upInfoName').textContent = contactName + (contactSurname ? ' ' + contactSurname : '');
    document.getElementById('upInfoUsername').textContent = '@' + u.username;
    document.getElementById('upInfoBio').textContent = isBanned ? 'Аккаунт удалён' : (u.bio || 'Не указано');

    document.getElementById('upBotNotice').style.display = (u.username === SUPPORT_USERNAME) ? 'flex' : 'none';
    
    const msgBtn = document.getElementById('upMessageBtn');
    if (isBanned) {
      msgBtn.disabled = true;
      msgBtn.textContent = '🚫 Заблокирован';
      msgBtn.style.opacity = '0.5';
    } else {
      msgBtn.disabled = false;
      msgBtn.textContent = '💬 Сообщение';
      msgBtn.style.opacity = '1';
    }
    
    document.getElementById('userProfileView').classList.add('active');
    
    document.querySelectorAll('#userProfileView .profile-tab').forEach(t => t.classList.remove('active'));
    document.querySelector('#userProfileView .profile-tab[data-tab="upInfo"]')?.classList.add('active');
    document.querySelectorAll('#userProfileView .profile-tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById('upInfo').classList.add('active');
    
    renderUpGifts(username);
    
    playSound('click');
  } catch(e) {
    showToast('Нет связи с сервером');
  }
}

function renderUpGifts(username) {
  const grid = document.getElementById('upGiftsGrid');
  const empty = document.getElementById('upGiftsEmpty');
  
  fetch(`${API_BASE}/api/gifts/user?username=${encodeURIComponent(username)}`, {
    headers: { 'Authorization': `Bearer ${session.token}` }
  })
  .then(r => r.json())
  .then(data => {
    if (!data.ok || !data.gifts || data.gifts.length === 0) {
      grid.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';
    const gifts = data.gifts || [];
    const activeGifts = gifts.filter(g => !g.sold);
    if (activeGifts.length === 0) {
      grid.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    grid.innerHTML = activeGifts.map((g, i) => {
      const createdDate = new Date(g.created_at);
      const months = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
      const dateStr = `${String(createdDate.getDate()).padStart(2,'0')} ${months[createdDate.getMonth()]} ${createdDate.getFullYear()}`;
      return `
      <div class="gift-item" style="animation-delay:${i * 0.05}s" onclick="openUpGiftDetail(${g.id})">
        <span class="gift-emoji">${g.gift_emoji || '🎁'}</span>
        <div class="gift-name">${g.gift_name || 'Подарок'}</div>
        <div class="gift-from">от @${g.from_username || 'неизвестно'}</div>
        <div class="gift-date">${dateStr}</div>
      </div>
    `}).join('');
  })
  .catch(() => {
    grid.innerHTML = '<div class="empty-state">Ошибка загрузки</div>';
  });
}

// ===================== WEBSOCKET =====================
function connectWebSocket() {
  if (!session.token) return;
  
  ws = new WebSocket(`${WS_BASE}/ws?token=${session.token}`);
  
  ws.onopen = () => {
    document.getElementById('connStatus').textContent = 'Подключено к серверу';
    wsPingTimer = setInterval(() => {
      if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'ping' }));
    }, 25000);
  };
  
  ws.onmessage = async (event) => {
    try {
      const data = JSON.parse(event.data);
      
      if (data.type === 'banned') {
        showBannedScreen(session.phone);
        showToast('🚫 Аккаунт заблокирован!');
        return;
      }
      
      if (data.type === 'message') {
        if (data.client_msg_id && sentMessages.has(data.client_msg_id)) {
          sentMessages.delete(data.client_msg_id);
          return;
        }
        const chatId = data.from;
        if (chatId !== currentChatWith) incrementUnread(chatId);
        const isFromCurrent = data.from === currentChatWith;
        if (isFromCurrent) {
          appendBubble('in', data.text, data.created_at, data.attachment_url, data.id, data.reply_to);
          scrollMessagesToBottom();
          resetUnread(chatId);
          playSound('click');
        }
        if (chats[data.from]) {
          chats[data.from].lastText = data.text || 'Фотография';
          chats[data.from].lastTime = data.created_at;
          renderChatList();
        }
        if (notifEnabled && data.from !== session.username && !isFromCurrent) {
          showToast(`📩 ${data.from}: ${data.text || 'сообщение'}`);
        }
      } else if (data.type === 'group_message') {
        if (data.client_msg_id && sentMessages.has(data.client_msg_id)) {
          sentMessages.delete(data.client_msg_id);
          return;
        }
        const groupId = data.group_id;
        if (groupId !== currentChatWith) incrementUnread(groupId);
        const isFromCurrent = groupId === currentChatWith && currentChatIsGroup;
        if (isFromCurrent) {
          appendBubble('in', data.text, data.created_at, data.attachment_url, data.id, data.reply_to);
          scrollMessagesToBottom();
          resetUnread(groupId);
          playSound('click');
        }
        if (chats[groupId]) {
          chats[groupId].lastText = data.text || 'Фотография';
          chats[groupId].lastTime = data.created_at;
          renderChatList();
        }
        if (notifEnabled && data.from !== session.username && !isFromCurrent) {
          showToast(`💬 Группа: ${data.from}: ${data.text || 'сообщение'}`);
        }
      } else if (data.type === 'presence') {
        presenceMap[data.username] = { online: data.online, last_seen: data.last_seen };
        if (currentChatWith === data.username) {
          const statusEl = document.getElementById('chatHeaderStatus');
          statusEl.textContent = presenceLabel(data.username);
          statusEl.className = 'chat-header-status' + (data.online ? ' online' : '');
        }
      } else if (data.type === 'typing' && data.from === currentChatWith) {
        const statusEl = document.getElementById('chatHeaderStatus');
        statusEl.textContent = 'печатает...';
        statusEl.className = 'chat-header-status typing';
        clearTimeout(typingIndicatorTimeout);
        typingIndicatorTimeout = setTimeout(() => {
          statusEl.textContent = presenceLabel(currentChatWith);
          statusEl.className = 'chat-header-status' + (presenceMap[currentChatWith]?.online ? ' online' : '');
        }, 3000);
      } else if (data.type === 'group_update') {
        showToast(`🔄 Группа "${data.group_name}" обновлена`);
        loadGroupsList();
        loadChatsList();
      } else if (data.type === 'group_added') {
        showToast(`✅ Вы добавлены в группу "${data.group_name}"`);
        loadGroupsList();
        loadChatsList();
      } else if (data.type === 'nft_gift') {
        showToast(`🏆 ${data.message || 'Вы получили NFT!'}`);
        loadChatsList();
        syncProfileFromServer();
      } else if (data.type === 'premium_activated') {
        showToast(`⭐ ${data.message || 'Premium активирован!'}`);
        syncProfileFromServer();
      } else if (data.type === 'wallet_gift') {
        // МГНОВЕННОЕ ОБНОВЛЕНИЕ БАЛАНСА С СЕРВЕРА
        await fetchWalletBalanceFromServer(true);
        await loadWalletTransactions();
        renderWallet();
        renderProfileGifts();
        showToast(data.message || '🎁 Подарок получен!');
        playSound('click');
      } else if (data.type === 'wallet_update') {
        // Мгновенное обновление баланса от бота (/givedc)
        await fetchWalletBalanceFromServer(true);
        renderWallet();
        renderProfileGifts();
        showToast(`💰 Баланс обновлён: ${walletBalance} ❤️`);
      }
    } catch(e) {}
  };
  
  ws.onclose = () => {
    clearInterval(wsPingTimer);
    document.getElementById('connStatus').textContent = 'Переподключение...';
    wsReconnectTimer = setTimeout(connectWebSocket, 3000);
  };
}

function onGroupAvatarSelected(event) {
  const file = event.target.files[0];
  if (!file || !currentGroupId) return;
  
  const formData = new FormData();
  formData.append('avatar', file);
  formData.append('group_id', currentGroupId);
  
  fetch(`${API_BASE}/api/groups/upload_avatar`, {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${session.token}` },
    body: formData
  })
    .then(res => res.json())
    .then(data => {
      if (data.ok) {
        showToast('Аватар группы обновлен');
        openGroupProfile(currentGroupId);
        loadGroupsList();
        loadChatsList();
        playSound('click');
      } else {
        showToast(data.error || 'Ошибка загрузки');
      }
    })
    .catch(() => showToast('Ошибка соединения'));
}

// ===================== INITIALIZATION =====================
window.addEventListener('DOMContentLoaded', () => {
  initTheme();
  
  fetch(`${API_BASE}/api/ping`)
    .then(r => r.json())
    .then(data => {
      if (data.ok) {
        document.getElementById('connStatus').textContent = '✅ Сервер доступен';
      }
    })
    .catch(() => {
      document.getElementById('connStatus').textContent = '⚠️ Сервер недоступен';
    });
  
  const savedToken = localStorage.getItem('dicegram_token');
  const savedSession = localStorage.getItem('dicegram_session_cache');
  
  if (savedToken && savedSession) {
    try {
      session = JSON.parse(savedSession);
      session.token = savedToken;
      if (session.is_banned) {
        showBannedScreen(session.phone);
        return;
      }
      enterApp();
      return;
    } catch(e) {}
  }
  
  goTo('welcome');
  document.getElementById('loadingScreen').classList.remove('active');
});
