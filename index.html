<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DICEGRAM</title>
    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #0f0f0f;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .app {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 850px;
            background: #17212b;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }
        .status-bar {
            background: #17212b;
            padding: 8px 20px 4px;
            display: flex;
            justify-content: space-between;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            flex-shrink: 0;
            z-index: 10;
        }
        .header {
            background: #2b5278;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
            flex-shrink: 0;
            min-height: 54px;
            z-index: 10;
        }
        .header .back {
            font-size: 24px;
            cursor: pointer;
            display: none;
            width: 30px;
        }
        .header .avatar-small {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #5288c1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            color: white;
            flex-shrink: 0;
        }
        .header .title {
            font-size: 17px;
            font-weight: 600;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .header .actions {
            display: flex;
            gap: 16px;
            font-size: 20px;
        }
        
        /* АВТОРИЗАЦИЯ */
        #authScreen {
            flex: 1;
            background: #17212b;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        #authScreen .logo {
            font-size: 42px;
            font-weight: 800;
            color: #2b5278;
        }
        #authScreen .subtitle {
            color: #8e9aa8;
            font-size: 14px;
            text-align: center;
        }
        #authScreen .input-group {
            width: 100%;
            max-width: 320px;
        }
        #authScreen input {
            width: 100%;
            padding: 14px 16px;
            background: #1f2c38;
            border: 2px solid #2b5278;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            outline: none;
        }
        #authScreen input:focus {
            border-color: #4d8bc0;
        }
        #authScreen input::placeholder {
            color: #6c7a8a;
        }
        #authScreen .btn {
            width: 100%;
            max-width: 320px;
            padding: 14px;
            background: #2b5278;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        #authScreen .btn:active {
            transform: scale(0.97);
        }
        #authScreen .btn:disabled {
            opacity: 0.5;
        }
        #authScreen .error {
            color: #e74c3c;
            font-size: 14px;
            text-align: center;
        }
        .country-row {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 320px;
        }
        .country-row select {
            width: 35%;
            padding: 14px;
            background: #1f2c38;
            border: 2px solid #2b5278;
            border-radius: 12px;
            color: white;
            font-size: 16px;
        }
        .country-row input {
            flex: 1;
        }
        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 100%;
            max-width: 280px;
        }
        .numpad button {
            padding: 16px;
            background: #1f2c38;
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 22px;
            font-weight: 500;
            cursor: pointer;
            aspect-ratio: 1;
        }
        .numpad button:active {
            background: #2b3d4d;
            transform: scale(0.95);
        }
        .numpad .empty {
            background: transparent;
            cursor: default;
        }
        
        /* СПИСОК ЧАТОВ */
        #chatsScreen {
            flex: 1;
            display: none;
            flex-direction: column;
            background: #17212b;
            overflow: hidden;
        }
        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }
        .chat-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            gap: 12px;
            cursor: pointer;
            border-bottom: 1px solid #1f2c38;
        }
        .chat-item:active {
            background: #1f2c38;
        }
        .chat-item .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #5288c1;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 18px;
            color: white;
            overflow: hidden;
        }
        .chat-item .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .chat-item .info {
            flex: 1;
            min-width: 0;
        }
        .chat-item .name {
            color: white;
            font-size: 16px;
            font-weight: 500;
        }
        .chat-item .last-msg {
            color: #8e9aa8;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-item .time {
            color: #6c7a8a;
            font-size: 12px;
            flex-shrink: 0;
        }
        .chat-item .unread {
            background: #2b5278;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
        }
        
        /* ЧАТ */
        #chatScreen {
            flex: 1;
            display: none;
            flex-direction: column;
            background: #0e1621;
        }
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .msg {
            max-width: 80%;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 15px;
            line-height: 1.4;
            word-wrap: break-word;
            position: relative;
        }
        .msg.out {
            align-self: flex-end;
            background: #2b5278;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .msg.in {
            align-self: flex-start;
            background: #1f2c38;
            color: white;
            border-bottom-left-radius: 4px;
        }
        .msg .time {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 4px;
            display: block;
            text-align: right;
        }
        .msg .sender {
            font-size: 12px;
            color: #4d8bc0;
            font-weight: 600;
            display: block;
            margin-bottom: 2px;
        }
        .msg .media-badge {
            background: rgba(255,255,255,0.1);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            display: inline-block;
            margin-bottom: 4px;
        }
        .input-bar {
            padding: 8px 12px;
            background: #1f2c38;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-shrink: 0;
        }
        .input-bar input {
            flex: 1;
            padding: 10px 14px;
            background: #17212b;
            border: none;
            border-radius: 20px;
            color: white;
            font-size: 16px;
            outline: none;
        }
        .input-bar input::placeholder {
            color: #6c7a8a;
        }
        .input-bar button {
            background: #2b5278;
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
        }
        .input-bar button:active {
            transform: scale(0.9);
        }
        
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #2b5278;
            border-radius: 4px;
        }
        @media (max-width: 440px) {
            .app {
                max-height: 100vh;
                border-radius: 0;
            }
        }
        #codeGroup, #passwordGroup {
            display: none;
            width: 100%;
            max-width: 320px;
        }
        #codeGroup input, #passwordGroup input {
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="app" id="app">
    <div class="status-bar">
        <span id="timeDisplay">12:00</span>
        <span>📶 📶 🔋</span>
    </div>

    <!-- АВТОРИЗАЦИЯ -->
    <div id="authScreen">
        <div class="logo">✈️ DICEGRAM</div>
        <div class="subtitle">Введите номер телефона</div>
        
        <div class="country-row">
            <select id="countryCode">
                <option value="+7">🇷🇺 +7</option>
                <option value="+380">🇺🇦 +380</option>
                <option value="+1">🇺🇸 +1</option>
                <option value="+44">🇬🇧 +44</option>
                <option value="+49">🇩🇪 +49</option>
                <option value="+33">🇫🇷 +33</option>
                <option value="+86">🇨🇳 +86</option>
                <option value="+91">🇮🇳 +91</option>
            </select>
            <input type="tel" id="phoneInput" placeholder="Номер телефона" maxlength="15">
        </div>

        <div id="codeGroup">
            <input type="text" id="codeInput" placeholder="Код из Telegram" maxlength="8">
        </div>
        <div id="passwordGroup">
            <input type="password" id="passwordInput" placeholder="Пароль 2FA" maxlength="64">
        </div>

        <button class="btn" id="authBtn" onclick="handleAuth()">Продолжить</button>
        <div class="error" id="authError"></div>

        <div class="numpad">
            <button onclick="typeNum('1')">1</button>
            <button onclick="typeNum('2')">2</button>
            <button onclick="typeNum('3')">3</button>
            <button onclick="typeNum('4')">4</button>
            <button onclick="typeNum('5')">5</button>
            <button onclick="typeNum('6')">6</button>
            <button onclick="typeNum('7')">7</button>
            <button onclick="typeNum('8')">8</button>
            <button onclick="typeNum('9')">9</button>
            <button onclick="typeNum('+')">+</button>
            <button onclick="typeNum('0')">0</button>
            <button class="empty"></button>
        </div>
    </div>

    <!-- СПИСОК ЧАТОВ -->
    <div id="chatsScreen">
        <div class="header">
            <div class="back" onclick="goToAuth()">‹</div>
            <div class="avatar-small" id="myAvatar">👤</div>
            <div class="title" id="myName">DICEGRAM</div>
            <div class="actions">
                <span onclick="logout()">🚪</span>
            </div>
        </div>
        <div class="chat-list" id="chatList">
            <div style="text-align:center; color:#6c7a8a; padding:40px 20px;">Загрузка...</div>
        </div>
    </div>

    <!-- ЧАТ -->
    <div id="chatScreen">
        <div class="header" id="chatHeader">
            <div class="back" onclick="goToChats()">‹</div>
            <div class="avatar-small" id="chatAvatar">👤</div>
            <div class="title" id="chatTitle">Чат</div>
            <div class="actions">
                <span>📌</span>
            </div>
        </div>
        <div class="messages-container" id="messagesContainer">
            <div style="text-align:center; color:#6c7a8a; padding:40px 20px;">Загрузка...</div>
        </div>
        <div class="input-bar">
            <input type="text" id="messageInput" placeholder="Сообщение..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">➤</button>
        </div>
    </div>
</div>

<script>
    let state = {
        phone: '',
        step: 'phone',
        chatId: null,
        socket: null
    };

    const API_URL = window.location.origin;

    document.addEventListener('DOMContentLoaded', () => {
        updateTime();
        setInterval(updateTime, 1000);
        document.getElementById('phoneInput').focus();
    });

    function updateTime() {
        const now = new Date();
        document.getElementById('timeDisplay').textContent = 
            now.getHours().toString().padStart(2,'0') + ':' + 
            now.getMinutes().toString().padStart(2,'0');
    }

    function typeNum(num) {
        const phoneInput = document.getElementById('phoneInput');
        const codeInput = document.getElementById('codeInput');
        if (document.getElementById('codeGroup').style.display === 'block' && codeInput.value.length < 8) {
            codeInput.value += num;
        } else if (document.getElementById('codeGroup').style.display !== 'block') {
            phoneInput.value += num;
        }
    }

    async function handleAuth() {
        const btn = document.getElementById('authBtn');
        const error = document.getElementById('authError');
        btn.disabled = true;
        error.textContent = '';

        try {
            if (state.step === 'phone') {
                const phone = document.getElementById('phoneInput').value.trim();
                if (!phone || phone.length < 4) {
                    error.textContent = 'Введите корректный номер';
                    btn.disabled = false;
                    return;
                }
                state.phone = phone;
                
                const res = await fetch('/api/init', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({phone: state.phone})
                });
                const data = await res.json();
                
                if (data.status === 'code_sent') {
                    state.step = 'code';
                    document.getElementById('phoneInput').style.display = 'none';
                    document.getElementById('codeGroup').style.display = 'block';
                    document.getElementById('codeInput').focus();
                    btn.textContent = 'Подтвердить код';
                } else {
                    error.textContent = data.error || 'Ошибка';
                }
            } 
            else if (state.step === 'code' || state.step === '2fa') {
                const code = document.getElementById('codeInput').value.trim();
                const password = document.getElementById('passwordInput').value.trim();
                
                if (!code) {
                    error.textContent = 'Введите код';
                    btn.disabled = false;
                    return;
                }
                
                const body = {
                    phone: state.phone,
                    code: code
                };
                if (password) body.password = password;
                
                const res = await fetch('/api/verify', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                
                if (data.status === '2fa_required') {
                    state.step = '2fa';
                    document.getElementById('passwordGroup').style.display = 'block';
                    document.getElementById('passwordInput').focus();
                    btn.textContent = 'Подтвердить 2FA';
                    error.textContent = 'Введите пароль 2FA';
                } else if (data.status === 'success') {
                    // Успешный вход
                    document.getElementById('authScreen').style.display = 'none';
                    document.getElementById('chatsScreen').style.display = 'flex';
                    
                    connectSocket();
                    loadDialogs();
                    loadMyInfo();
                } else {
                    error.textContent = data.error || 'Ошибка';
                }
            }
        } catch (e) {
            error.textContent = 'Ошибка: ' + e.message;
        }
        btn.disabled = false;
    }

    async function loadMyInfo() {
        try {
            const res = await fetch('/api/me', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({phone: state.phone})
            });
            const data = await res.json();
            if (data.first_name) {
                document.getElementById('myName').textContent = data.first_name + ' ' + (data.last_name || '');
                document.getElementById('myAvatar').textContent = data.first_name[0] || '👤';
            }
        } catch (e) {
            console.error('Load my info error:', e);
        }
    }

    async function loadDialogs() {
        try {
            const res = await fetch('/api/dialogs', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({phone: state.phone})
            });
            const data = await res.json();
            
            const list = document.getElementById('chatList');
            if (data.dialogs && data.dialogs.length > 0) {
                list.innerHTML = data.dialogs.map(d => `
                    <div class="chat-item" onclick="openChat('${d.id}', '${d.name}')">
                        <div class="avatar">${d.photo ? `<img src="data:image/jpeg;base64,${d.photo}">` : d.name[0] || '👤'}</div>
                        <div class="info">
                            <div class="name">${d.name}</div>
                            <div class="last-msg">${d.last_message || 'Нет сообщений'}</div>
                        </div>
                        <div class="time">${formatTime(d.date)}</div>
                        ${d.unread > 0 ? `<div class="unread">${d.unread}</div>` : ''}
                    </div>
                `).join('');
            } else {
                list.innerHTML = '<div style="text-align:center; color:#6c7a8a; padding:40px 20px;">Нет чатов</div>';
            }
        } catch (e) {
            console.error('Load dialogs error:', e);
        }
    }

    async function loadMessages(chatId) {
        try {
            const res = await fetch('/api/messages', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    phone: state.phone,
                    chat_id: chatId,
                    limit: 50
                })
            });
            const data = await res.json();
            
            const container = document.getElementById('messagesContainer');
            if (data.messages && data.messages.length > 0) {
                container.innerHTML = data.messages.map(msg => `
                    <div class="msg ${msg.outgoing ? 'out' : 'in'}">
                        ${!msg.outgoing ? `<span class="sender">${msg.sender_name || 'User'}</span>` : ''}
                        ${msg.media ? '<span class="media-badge">📎 Медиа</span>' : ''}
                        ${msg.text || '📎 Медиафайл'}
                        <span class="time">${formatTime(msg.date)} ${msg.outgoing ? '✓✓' : ''}</span>
                    </div>
                `).join('');
                container.scrollTop = container.scrollHeight;
            } else {
                container.innerHTML = '<div style="text-align:center; color:#6c7a8a; padding:40px 20px;">Нет сообщений</div>';
            }
        } catch (e) {
            console.error('Load messages error:', e);
        }
    }

    async function sendMessage() {
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if (!text || !state.chatId) return;
        
        try {
            const res = await fetch('/api/send', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    phone: state.phone,
                    chat_id: state.chatId,
                    text: text
                })
            });
            const data = await res.json();
            
            if (data.id) {
                const container = document.getElementById('messagesContainer');
                const msgDiv = document.createElement('div');
                msgDiv.className = 'msg out';
                msgDiv.innerHTML = `
                    ${text}
                    <span class="time">${new Date().toLocaleTimeString()} ✓✓</span>
                `;
                container.appendChild(msgDiv);
                container.scrollTop = container.scrollHeight;
                input.value = '';
            }
        } catch (e) {
            console.error('Send message error:', e);
        }
    }

    function openChat(chatId, name) {
        state.chatId = chatId;
        document.getElementById('chatsScreen').style.display = 'none';
        document.getElementById('chatScreen').style.display = 'flex';
        document.getElementById('chatTitle').textContent = name;
        document.getElementById('chatAvatar').textContent = name[0] || '👤';
        
        loadMessages(chatId);
        
        if (state.socket) {
            state.socket.emit('join', {phone: state.phone, chat_id: chatId});
        }
    }

    function goToChats() {
        document.getElementById('chatScreen').style.display = 'none';
        document.getElementById('chatsScreen').style.display = 'flex';
        state.chatId = null;
    }

    function goToAuth() {
        document.getElementById('chatsScreen').style.display = 'none';
        document.getElementById('authScreen').style.display = 'flex';
        location.reload();
    }

    function logout() {
        if (confirm('Выйти из аккаунта?')) {
            location.reload();
        }
    }

    function connectSocket() {
        state.socket = io();
        state.socket.on('connect', () => {
            console.log('🔌 WebSocket connected');
        });
        
        state.socket.on('new_message', (data) => {
            if (state.chatId) {
                const container = document.getElementById('messagesContainer');
                const msgDiv = document.createElement('div');
                msgDiv.className = `msg ${data.outgoing ? 'out' : 'in'}`;
                msgDiv.innerHTML = `
                    ${data.text || '📎 Медиа'}
                    <span class="time">${formatTime(data.date)} ${data.outgoing ? '✓✓' : ''}</span>
                `;
                container.appendChild(msgDiv);
                container.scrollTop = container.scrollHeight;
            }
        });
    }

    function formatTime(dateStr) {
        if (!dateStr) return '';
        const date = new Date(dateStr);
        return date.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
    }
</script>
</body>
</html>
